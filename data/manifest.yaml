# Kaggle API / HTTP Content-Length on 2026-11-17, T1). Remaining [CANDIDATE] sizes are measured in T3 and updated here.
# sha256 is filled in after the first verified download (TBD until then).
# target: hdd = the RAW root. It defaults via $OUTRUN_RAW; on this machine it is /Users/milto/OutrunData/raw on the
#         internal SSD (storage decision Nov 17: there is no external HDD; the "hdd" name is kept, cap 300 GB).
#         ssd = PROC root ($OUTRUN_PROC; on this machine /Users/milto/OutrunData/proc, cap 150 GB);
#         stream = byte-range fetched, cropped in memory, never stored raw.

