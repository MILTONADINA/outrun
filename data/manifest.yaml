# Data manifest (committed). One entry per source. `outrun fetch` reads this file.
# approx_bytes are DESIGN estimates; [CANDIDATE] sizes are measured in T1/T3 and updated here.
# sha256 is filled in after the first verified download (TBD until then).
# target: hdd = RAW on the external HDD ($OUTRUN_RAW, default /Volumes/OutrunRaw);
#         ssd = PROC on the internal SSD ($OUTRUN_PROC); stream = byte-range fetched, cropped in memory, never stored raw.

version: 1
sources:
  - id: sevir_catalog
    desc: SEVIR CATALOG.csv
    url: s3://sevir/CATALOG.csv
    access: s3_unsigned
    approx_bytes: 34000000
    license: "CC BY 4.0 [CANDIDATE]"
    target: hdd
    sha256: TBD
