name: tests

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (eccodes for cfgrib)
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Unit tests (synthetic fixtures only, no network)
        run: python -m pytest -m "not slow and not acceptance and not e2e"
