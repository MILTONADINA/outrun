name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries (eccodes for cfgrib)
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Unit tests (offline, no data or models or network)
        env:
          OUTRUN_RAW: ${{ runner.temp }}/empty-raw
          OUTRUN_PROC: ${{ runner.temp }}/empty-proc
        run: |
          mkdir -p "$OUTRUN_RAW" "$OUTRUN_PROC"
          python -m pytest -m "not slow and not acceptance and not e2e"
      - name: Static export builds from the committed bundles
        run: python -m outrun export-static --out "$RUNNER_TEMP/site"
