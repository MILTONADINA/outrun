[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outrun"
version = "0.1.0"
description = "Deep-learning hazard forecasts (storm, tornado, flash flood, wildfire, ice, smoke) feeding time-dependent A* and optimization for safe evacuation and emergency routing, with an interactive map app"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Milton Adina" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  # deep learning + numerics
  "torch>=2.4",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  # array / file formats
  "pyarrow>=15",
  "xarray>=2024.1",
  "zarr>=2.17",
  "h5py>=3.10",
  "netCDF4>=1.6",
  "tfrecord>=1.14",
  "pillow>=10",
  # geospatial
  "rasterio>=1.3",
  "pyproj>=3.6",
  "geopandas>=0.14",
  "shapely>=2.0",
  "osmnx>=1.9",
  "networkx>=3.2",
  # optimization
  "ortools>=9.8",
  # weather data access
  "herbie-data>=2024.1",
  "cfgrib>=0.9.10",
  "boto3>=1.34",
  "requests>=2.31",
  "kaggle>=1.6",  # NDWS download (needs ~/.kaggle/kaggle.json)
  # app
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  # misc
  "pyyaml>=6",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "playwright>=1.44", "pre-commit>=3.6"]
fast = ["numba>=0.59"]

[project.scripts]
outrun = "outrun.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outrun = ["app/static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/unit"]
addopts = "-ra -m 'not acceptance and not e2e'"
markers = [
  "req(id): links a test to a requirement ID in specs/ (see specs/00-overview.md)",
  "slow: trains a tiny model or runs a longer synthetic search (seconds, offline)",
  "acceptance: real data + trained models (opt-in: OUTRUN_ACCEPTANCE=1 pytest tests/acceptance -m acceptance)",
  "e2e: Playwright browser tests against a local server (opt-in: pytest tests/e2e -m e2e)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs", "scenarios", "data", "models", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
